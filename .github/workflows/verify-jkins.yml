name: Verify jkins formula

on:
  push:
    paths:
      - Formula/jkins.rb
      - .github/workflows/verify-jkins.yml
  workflow_dispatch:

jobs:
  install:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - run: brew tap masonhuemmer/tap https://github.com/masonhuemmer/homebrew-tap
      - run: brew install masonhuemmer/tap/jkins
      - run: test "$(jkins --version)" = "jkins v2.462.3"
      - run: brew test masonhuemmer/tap/jkins
